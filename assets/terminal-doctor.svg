<text x="22" y="58" fill="#e6e6e6" font-size="13" xml:space="preserve">╭───────────────────────────────────── Hardware detectado ─────────────────────────────────────╮</text>
<text x="22" y="78" fill="#c8c8c8" font-size="13" xml:space="preserve">│                  Sistema  Darwin arm64                                                       │</text>
<text x="22" y="98" fill="#c8c8c8" font-size="13" xml:space="preserve">│                      CPU  Apple M2                                                           │</text>
<text x="22" y="118" fill="#c8c8c8" font-size="13" xml:space="preserve">│                  Núcleos  8 físicos / 8 lógicos                                              │</text>
<text x="22" y="138" fill="#c8c8c8" font-size="13" xml:space="preserve">│                P/E cores  4 P + 4 E                                                          │</text>
<text x="22" y="158" fill="#c8c8c8" font-size="13" xml:space="preserve">│                      RAM  8.0 GB                                                             │</text>
<text x="22" y="178" fill="#c8c8c8" font-size="13" xml:space="preserve">│ Hilos recomendados (XMR)  4                                                                  │</text>
<text x="22" y="198" fill="#e6e6e6" font-size="13" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="22" y="218" fill="#e6e6e6" font-size="13" xml:space="preserve">╭───────────────────────────────────── Mineros detectados ─────────────────────────────────────╮</text>
<text x="22" y="238" fill="#c8c8c8" font-size="13" xml:space="preserve">│ xmrig:     no instalado                                                                      │</text>
<text x="22" y="258" fill="#c8c8c8" font-size="13" xml:space="preserve">│ mxmr:      en PATH                                                                           │</text>
<text x="22" y="278" fill="#c8c8c8" font-size="13" xml:space="preserve">│ cgminer:   no instalado                                                                      │</text>
<text x="22" y="298" fill="#c8c8c8" font-size="13" xml:space="preserve">│ bfgminer:  no instalado                                                                      │</text>
<text x="22" y="318" fill="#c8c8c8" font-size="13" xml:space="preserve">│ minerd:    no instalado                                                                      │</text>
<text x="22" y="338" fill="#e6e6e6" font-size="13" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="22" y="358" fill="#e6e6e6" font-size="13" xml:space="preserve">Secrets guardados en: file (0600)</text>
