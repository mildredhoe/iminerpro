<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="MinerPro — minería de criptomonedas real, BTC y XMR, local o nube">
  <title>MinerPro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f12"/>
      <stop offset="55%" stop-color="#0a0c0e"/>
      <stop offset="100%" stop-color="#0e1418"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#50fa7b" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#50fa7b" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#50fa7b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50fa7b"/>
      <stop offset="55%" stop-color="#8be9fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50fa7b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#50fa7b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1278" height="418" rx="22" fill="none" stroke="#23282e"/>

  <!-- marca -->
  <g transform="translate(64,74)">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="#10161a" stroke="#2b3a33"/>
    <path d="M18 40 L40 18" stroke="#50fa7b" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 26 q16 -12 30 2" stroke="#8be9fd" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="18" r="4" fill="#50fa7b"/>
  </g>

  <text x="146" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="52" font-weight="700" letter-spacing="6" fill="url(#title)">MINER PRO</text>
  <text x="148" y="146" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="19" fill="#c9d1d9">Minería de cripto real · BTC y XMR · local o nube</text>

  <!-- pills -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    <rect x="148" y="176" width="248" height="34" rx="17" fill="#12211a" stroke="#2f6b4a"/>
    <text x="272" y="198" fill="#7ee2a8" text-anchor="middle">XMRig verificado SHA-256</text>

    <rect x="410" y="176" width="196" height="34" rx="17" fill="#101d22" stroke="#2b5a68"/>
    <text x="508" y="198" fill="#8be9fd" text-anchor="middle">NiceHash API v2</text>

    <rect x="620" y="176" width="212" height="34" rx="17" fill="#1b1a26" stroke="#4b4570"/>
    <text x="726" y="198" fill="#b9a8ff" text-anchor="middle">Binance Pool API</text>
  </g>

  <text x="148" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="14" fill="#7d8590">No arranca el minado solo · APIs en solo lectura · claves en el llavero</text>

  <!-- terminal mini -->
  <g transform="translate(848,64)">
    <rect x="0" y="0" width="368" height="292" rx="16" fill="#0b0d0f" stroke="#26282c"/>
    <rect x="0" y="0" width="368" height="34" rx="16" fill="#141719"/>
    <rect x="0" y="22" width="368" height="12" fill="#141719"/>
    <line x1="0" y1="34" x2="368" y2="34" stroke="#26282c"/>
    <circle cx="22" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="5" fill="#febc2e"/>
    <circle cx="58" cy="17" r="5" fill="#28c840"/>
    <text x="184" y="22" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12"
          fill="#8b949e" text-anchor="middle">minerpro mine</text>

    <text x="22" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26"
          font-weight="700" fill="#50fa7b">4.82 kH/s</text>
    <text x="22" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12"
          fill="#6e7681">RandomX · 4 hilos P-core · uptime 12m 04s</text>

    <g transform="translate(22,110)">
      <path d="M0,44 L18,40 L36,42 L54,30 L72,33 L90,22 L108,26 L126,14 L144,18 L162,10 L180,15 L198,7 L216,12 L234,5 L252,10 L270,4 L288,9 L306,3 L324,8 L324,64 L0,64 Z"
            fill="url(#spark)"/>
      <polyline points="0,44 18,40 36,42 54,30 72,33 90,22 108,26 126,14 144,18 162,10 180,15 198,7 216,12 234,5 252,10 270,4 288,9 306,3 324,8"
                fill="none" stroke="#50fa7b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <line x1="22" y1="196" x2="346" y2="196" stroke="#1e2226"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#c9d1d9">
      <text x="22" y="220">shares    <tspan fill="#50fa7b">accepted 42</tspan>   <tspan fill="#6e7681">rejected 0</tspan></text>
      <text x="22" y="242">pool      <tspan fill="#8be9fd">SupportXMR</tspan> · PPLNS</text>
      <text x="22" y="264">balance   <tspan fill="#f1c40f">0.000412 XMR</tspan> <tspan fill="#6e7681">pendiente</tspan></text>
    </g>
  </g>
</svg>
